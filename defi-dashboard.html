<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceHub - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #06080f;
      --bg-secondary: #0c1017;
      --bg-card: rgba(15, 20, 32, 0.8);
      --bg-card-solid: #0f1420;
      --bg-card-hover: rgba(25, 32, 50, 0.9);
      --bg-input: #0a0e18;
      --bg-glass: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --border-focus: #6366f1;
      --text-primary: #f0f2f5;
      --text-secondary: #8b95a5;
      --text-muted: #555f70;
      --green: #10b981;
      --green-dim: rgba(16,185,129,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.12);
      --purple: #8b5cf6;
      --purple-dim: rgba(139,92,246,0.12);
      --orange: #f59e0b;
      --orange-dim: rgba(245,158,11,0.12);
      --cyan: #06b6d4;
      --gradient-purple: linear-gradient(135deg, #7c3aed, #a78bfa);
      --gradient-green: linear-gradient(135deg, #059669, #34d399);
      --gradient-blue: linear-gradient(135deg, #2563eb, #60a5fa);
      --gradient-red: linear-gradient(135deg, #dc2626, #f87171);
      --gradient-orange: linear-gradient(135deg, #d97706, #fbbf24);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: var(--font);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 30% 40%, rgba(59,130,246,0.05) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, rgba(16,185,129,0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 20%, rgba(139,92,246,0.03) 0%, transparent 50%);
      z-index: -1; animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift { 0% { transform: translate(0,0); } 100% { transform: translate(-2%,-1%); } }

    /* === NAV === */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: rgba(12,16,23,0.85);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--gradient-purple);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .nav-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      padding: 8px 14px; border-radius: var(--radius-sm);
      color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.85rem;
      transition: all 150ms ease;
    }
    .nav-link:hover { background: var(--bg-glass); color: var(--text-primary); }
    .nav-link.active { background: var(--blue-dim); color: var(--blue); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .btn-nav {
      background: var(--bg-glass); border: 1px solid var(--border);
      color: var(--text-secondary); padding: 7px 14px; border-radius: var(--radius-sm);
      cursor: pointer; font-family: var(--font); font-weight: 600; font-size: 0.8rem;
      transition: all 150ms ease;
    }
    .btn-nav:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .btn-icon {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; transition: all 150ms ease;
    }
    .btn-icon:hover { background: var(--bg-glass); border-color: var(--border-hover); color: var(--text-secondary); }
    .btn-icon--danger:hover { border-color: var(--red); background: var(--red-dim); color: var(--red); }

    /* === MAIN === */
    .main { max-width: 1360px; margin: 0 auto; padding: 28px; display: flex; flex-direction: column; gap: 28px; }

    /* === SUMMARY CARDS === */
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .summary-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px;
      position: relative; overflow: hidden;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }
    .summary-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .summary-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); border-color: var(--border-hover); }
    .summary-card--blue::before { background: var(--gradient-blue); }
    .summary-card--green::before { background: var(--gradient-green); }
    .summary-card--red::before { background: var(--gradient-red); }
    .summary-card--orange::before { background: var(--gradient-orange); }
    .summary-card__icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; margin-bottom: 14px;
    }
    .summary-card--blue .summary-card__icon { background: var(--blue-dim); }
    .summary-card--green .summary-card__icon { background: var(--green-dim); }
    .summary-card--red .summary-card__icon { background: var(--red-dim); }
    .summary-card--orange .summary-card__icon { background: var(--orange-dim); }
    .summary-card__label { display: block; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .summary-card__value { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .summary-card--blue .summary-card__value { color: var(--blue); }
    .summary-card--green .summary-card__value { color: var(--green); }
    .summary-card--red .summary-card__value { color: var(--red); }
    .summary-card--orange .summary-card__value { color: var(--orange); }

    /* === CHARTS === */
    .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .chart-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px;
    }
    .chart-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 16px; }
    .chart-card canvas { max-height: 280px; }

    /* === TRANSACTIONS === */
    .transactions-section { display: flex; flex-direction: column; gap: 16px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; }
    .section-header h2 { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; }
    .btn-primary {
      background: var(--gradient-blue); color: white; border: none;
      padding: 8px 18px; border-radius: var(--radius-sm);
      font-family: var(--font); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 200ms ease;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(37,99,235,0.35); }
    .btn-full { width: 100%; padding: 12px; }

    .transactions-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-input, .filter-select {
      padding: 8px 14px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: var(--font); font-size: 0.82rem; transition: border-color 150ms;
    }
    .filter-input:focus, .filter-select:focus { outline: none; border-color: var(--border-focus); }
    .filter-input { flex: 1; min-width: 180px; }
    .filter-select { min-width: 150px; }

    .transaction-list { display: flex; flex-direction: column; gap: 3px; }
    .transaction-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      transition: all 150ms ease;
    }
    .transaction-row:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }
    .transaction-row__icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0; background: var(--bg-glass);
    }
    .transaction-row__info { flex: 1; min-width: 0; }
    .transaction-row__desc { display: block; font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .transaction-row__category { display: block; color: var(--text-muted); font-size: 0.72rem; margin-top: 2px; font-weight: 500; }
    .transaction-row__date { color: var(--text-secondary); font-size: 0.8rem; flex-shrink: 0; }
    .transaction-row__amount { font-weight: 700; font-size: 0.92rem; flex-shrink: 0; min-width: 110px; text-align: right; }
    .amount--income { color: var(--green); }
    .amount--expense { color: var(--red); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state__icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.6; }
    .empty-state__text { font-size: 0.88rem; line-height: 1.6; }

    /* === MODAL === */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); display: none;
      align-items: center; justify-content: center;
      z-index: 200; backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-card-solid); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 28px;
      width: 90%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 1.1rem; font-weight: 800; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; color: var(--text-muted); font-size: 0.68rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .form-input, .form-select {
      width: 100%; padding: 10px 14px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: var(--font); font-size: 0.9rem; transition: border-color 150ms;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .form-toggle-group { display: flex; gap: 6px; }
    .form-toggle {
      flex: 1; padding: 10px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-muted); font-family: var(--font);
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 150ms;
    }
    .form-toggle--active-expense { background: var(--red-dim); border-color: var(--red); color: var(--red); }
    .form-toggle--active-income { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* === IMPORT FATURA === */
    .btn-import {
      background: linear-gradient(135deg, #d97706, #fbbf24); color: #000; border: none;
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-family: var(--font); font-weight: 700; font-size: 0.83rem;
      cursor: pointer; transition: all 200ms ease;
    }
    .btn-import:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(217,119,6,0.4); }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      padding: 9px 18px; border-radius: var(--radius-sm);
      font-family: var(--font); font-weight: 600; font-size: 0.85rem; cursor: pointer;
      transition: all 150ms;
    }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .import-modal-content {
      background: var(--bg-card-solid); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 28px;
      width: 97%; max-width: 820px; max-height: 92vh;
      display: flex; flex-direction: column;
    }
    .import-summary-bar {
      display: flex; gap: 20px; flex-wrap: wrap;
      padding: 11px 16px; background: var(--bg-glass);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 14px; font-size: 0.82rem; color: var(--text-secondary); align-items: center;
    }
    .import-summary-bar strong { color: var(--text-primary); }
    .import-badge {
      background: var(--purple-dim); color: var(--purple);
      border: 1px solid rgba(139,92,246,0.25);
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 0.76rem;
    }
    .import-table-wrap {
      overflow-y: auto; flex: 1; min-height: 0;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      margin-bottom: 14px;
    }
    .import-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .import-table th {
      position: sticky; top: 0; background: var(--bg-card-solid);
      padding: 10px 12px; text-align: left;
      color: var(--text-muted); font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }
    .import-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .import-table tr:last-child td { border-bottom: none; }
    .import-table tr.row-skip td { opacity: 0.35; }
    .import-table tr:hover td { background: var(--bg-glass); }
    .import-cat-select {
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-primary); font-family: var(--font);
      font-size: 0.77rem; padding: 4px 6px; border-radius: 6px;
      width: 100%; cursor: pointer;
    }
    .import-table col.col-chk  { width: 36px; }
    .import-table col.col-date { width: 88px; }
    .import-table col.col-desc { width: auto; }
    .import-table col.col-val  { width: 100px; }
    .import-table col.col-cat  { width: 158px; }
    .import-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .import-amount-expense { color: var(--red); font-weight: 700; }
    .import-amount-income { color: var(--green); font-weight: 700; }
    .import-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 260px; }

    /* === RESPONSIVE === */
    @media (max-width: 1024px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) {
      .nav { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
      .nav-links { order: 3; width: 100%; justify-content: center; }
      .main { padding: 16px; gap: 20px; }
      .summary-grid { grid-template-columns: 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      .transactions-filters { flex-direction: column; }
      .filter-input, .filter-select { min-width: 100%; }
      .transaction-row { flex-wrap: wrap; gap: 8px; }
      .transaction-row__amount { min-width: auto; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand">
      <div class="nav-logo">💰</div>
      <span class="nav-title">FinanceHub</span>
    </div>
    <div class="nav-links">
      <a href="defi-dashboard.html" class="nav-link" id="nav-dashboard">📊 Dashboard</a>
      <a href="defi-radar-v2.html" class="nav-link" id="nav-radar">🔍 DeFi Radar</a>
    </div>
    <div class="nav-actions">
      <button class="btn-nav" id="currencyToggle" onclick="toggleCurrency()">
        <span id="currencyLabel">R$ BRL</span>
      </button>
      <button class="btn-icon" onclick="exportData()" title="Exportar">📤</button>
      <button class="btn-icon" onclick="importData()" title="Importar">📥</button>
    </div>
  </nav>

  <main class="main">
    <section class="summary-grid">
      <div class="summary-card summary-card--blue">
        <div class="summary-card__icon">💰</div>
        <span class="summary-card__label">Saldo Total</span>
        <span class="summary-card__value" id="totalBalance">R$ 0,00</span>
      </div>
      <div class="summary-card summary-card--green">
        <div class="summary-card__icon">📈</div>
        <span class="summary-card__label">Receitas do Mês</span>
        <span class="summary-card__value" id="monthIncome">R$ 0,00</span>
      </div>
      <div class="summary-card summary-card--red">
        <div class="summary-card__icon">📉</div>
        <span class="summary-card__label">Despesas do Mês</span>
        <span class="summary-card__value" id="monthExpenses">R$ 0,00</span>
      </div>
      <div class="summary-card summary-card--orange">
        <div class="summary-card__icon">🎯</div>
        <span class="summary-card__label">Taxa de Economia</span>
        <span class="summary-card__value" id="savingsRate">0%</span>
      </div>
    </section>

    <section class="charts-grid">
      <div class="chart-card">
        <h3>Receitas vs Despesas</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Despesas por Categoria</h3>
        <canvas id="doughnutChart"></canvas>
      </div>
    </section>

    <section class="transactions-section">
      <div class="section-header">
        <h2>Transações</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn-import" onclick="openImportModal()">📄 Importar Fatura</button>
          <button class="btn-primary" onclick="openModal()">+ Nova Transação</button>
        </div>
      </div>
      <input type="file" id="importFileInput" accept=".ofx,.qfx,.csv,.txt" style="display:none" onchange="handleImportFile(event)">
      <div class="transactions-filters">
        <input type="text" class="filter-input" id="filterSearch" placeholder="🔍 Buscar..." oninput="filterTransactions()">
        <select class="filter-select" id="filterCategory" onchange="filterTransactions()"><option value="">Todas categorias</option></select>
        <select class="filter-select" id="filterType" onchange="filterTransactions()">
          <option value="">Todos tipos</option>
          <option value="income">📈 Receitas</option>
          <option value="expense">📉 Despesas</option>
        </select>
        <input type="month" class="filter-input" id="filterMonth" onchange="filterTransactions()" style="min-width:155px">
      </div>
      <div class="transaction-list" id="transactionList"></div>
    </section>
  </main>

  <div class="modal-overlay" id="transactionModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Nova Transação</h3>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>
      <form onsubmit="saveTransaction(event)">
        <div class="form-group">
          <label class="form-label">Tipo</label>
          <div class="form-toggle-group">
            <button type="button" class="form-toggle form-toggle--active-expense" id="toggleExpense" onclick="setType('expense')">📉 Despesa</button>
            <button type="button" class="form-toggle" id="toggleIncome" onclick="setType('income')">📈 Receita</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <input type="text" class="form-input" id="txnDescription" placeholder="Ex: Supermercado, Salário..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Valor (R$)</label>
          <input type="number" class="form-input" id="txnAmount" step="0.01" min="0.01" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="txnCategory" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Data</label>
          <input type="date" class="form-input" id="txnDate" required>
        </div>
        <input type="hidden" id="txnType" value="expense">
        <input type="hidden" id="editId" value="">
        <button type="submit" class="btn-primary btn-full">Salvar Transação</button>
      </form>
    </div>
  </div>

  <!-- IMPORT PREVIEW MODAL -->
  <div class="modal-overlay" id="importModal" onclick="if(event.target===this)closeImportModal()">
    <div class="import-modal-content">
      <div class="modal-header">
        <h3>📄 Importar Fatura</h3>
        <button class="btn-icon" onclick="closeImportModal()">✕</button>
      </div>
      <div id="importSummaryBar" class="import-summary-bar"></div>
      <div class="import-table-wrap">
        <table class="import-table" style="table-layout:fixed;width:100%">
          <colgroup>
            <col class="col-chk"><col class="col-date"><col class="col-desc"><col class="col-val"><col class="col-cat">
          </colgroup>
          <thead>
            <tr>
              <th><input type="checkbox" id="importCheckAll" onchange="toggleAllImport(this.checked)" checked title="Selecionar todas"></th>
              <th>Data</th>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Categoria</th>
            </tr>
          </thead>
          <tbody id="importTableBody"></tbody>
        </table>
      </div>
      <div class="import-actions">
        <button class="btn-ghost" onclick="closeImportModal()">Cancelar</button>
        <button class="btn-primary" id="importConfirmBtn" onclick="confirmImport()">✅ Importar selecionadas</button>
      </div>
    </div>
  </div>

  <script>
    // === CATEGORIES ===
    const CATEGORIES = {
      alimentacao:   { label: 'Alimentação',   emoji: '🍔', type: 'expense' },
      transporte:    { label: 'Transporte',    emoji: '🚗', type: 'expense' },
      moradia:       { label: 'Moradia',       emoji: '🏠', type: 'expense' },

    const CURRENCY_CONFIG = { BRL: { symbol: 'R$', locale: 'pt-BR', code: 'BRL' }, USD: { symbol: 'US$', locale: 'en-US', code: 'USD' } };
    function getCurrency() { return localStorage.getItem('finance_currency') || 'BRL'; }

    function formatCurrency(value, code) {

    }

    let exchangeRate = 5.2;
    async function fetchExchangeRate() {
      const cached = JSON.parse(localStorage.getItem('finance_exchange_rate') || '{}');
      if (cached.rate && (Date.now() - cached.timestamp) < 3600000) { exchangeRate = cached.rate; return; }
      try {
        const resp = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=usd-coin&vs_currencies=brl');
        const data = await resp.json();
        exchangeRate = data['usd-coin']?.brl || 5.2;
        localStorage.setItem('finance_exchange_rate', JSON.stringify({ rate: exchangeRate, timestamp: Date.now() }));
      } catch (e) { exchangeRate = cached.rate || 5.2; }
    }
    function convertValue(v) { return getCurrency() === 'USD' ? v / exchangeRate : v; }

            if (data.transactions) localStorage.setItem('finance_transactions', JSON.stringify(data.transactions));

    // === HELPERS ===
    function getCurrentMonthRange() {
      const now = new Date();
      return { start: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10),
               end: new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10) };
    }
    function getLast6Months() {
      const m = [], now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        m.push({ label: d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }),
                 start: d.toISOString().slice(0,10),
                 end: new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10) });
      }
      return m;
    }
    function sumByTypeAndRange(type, s, e) {
      return getTransactions().filter(t => t.type===type && t.date>=s && t.date<=e).reduce((a, t) => a + t.amount, 0);
    }
    function getCategoryTotals(type, s, e) {
      const txns = getTransactions().filter(t => t.type===type && t.date>=s && t.date<=e);
      const map = {};
      txns.forEach(t => { map[t.category] = (map[t.category]||0) + t.amount; });
      return Object.entries(map).map(([k,v]) => ({ key:k, total:v, label: CATEGORIES[k]?.label||k, emoji: CATEGORIES[k]?.emoji||'📦' })).sort((a,b) => b.total-a.total);
    }

    // === SUMMARY ===
    function updateSummaryCards() {
      const { start, end } = getCurrentMonthRange();
      const inc = sumByTypeAndRange('income', start, end);
      const exp = sumByTypeAndRange('expense', start, end);
      const allInc = getTransactions().filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const allExp = getTransactions().filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const rate = inc > 0 ? Math.round(((inc-exp)/inc)*100) : 0;
      document.getElementById('totalBalance').textContent = formatCurrency(convertValue(allInc - allExp));
      document.getElementById('monthIncome').textContent = formatCurrency(convertValue(inc));
      document.getElementById('monthExpenses').textContent = formatCurrency(convertValue(exp));
      document.getElementById('savingsRate').textContent = rate + '%';
    }

    function normalize(str) {
      return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ');
    }

    function autoCategorize(description) {
      const desc = normalize(description);
      for (const { keys, cat } of KEYWORD_MAP) {
        for (const key of keys) {
          if (desc.includes(normalize(key))) return cat;
        }
      }
      return 'outros';
    }

    // --- Parser OFX (Banco Inter, Itaú, Bradesco, Santander etc.) ---
    function parseOFX(text) {
      const transactions = [];
      const getVal = (block, tag) => {
        const m = block.match(new RegExp('<' + tag + '>([^<\\r\\n]+)', 'i'));
        return m ? m[1].trim() : '';
      };
      // Split on <STMTTRN> — works for both SGML and XML OFX
      const parts = text.split(/<STMTTRN>/i);
      parts.slice(1).forEach(block => {
        const dateRaw = getVal(block, 'DTPOSTED') || getVal(block, 'DTUSER');
        const amountRaw = getVal(block, 'TRNAMT');
        const memo = getVal(block, 'MEMO') || getVal(block, 'NAME') || 'Sem descrição';
        if (!dateRaw || !amountRaw) return;
        const y = dateRaw.slice(0,4), mo = dateRaw.slice(4,6), d = dateRaw.slice(6,8);
        if (!y || !mo || !d) return;
        const date = `${y}-${mo}-${d}`;
        const amount = parseFloat(amountRaw.replace(',','.'));
        if (isNaN(amount) || amount === 0) return;
        transactions.push({
          date,
          amount: Math.abs(amount),
          description: memo.replace(/\s+/g, ' ').trim(),
          type: amount < 0 ? 'expense' : 'income',
        });
      });
      return transactions;
    }

    // --- Parser CSV genérico (Nubank, C6, Inter CSV) ---
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const transactions = [];
      // Detect header columns
      const header = lines[0].toLowerCase().replace(/"/g, '');
      const cols = header.split(/[,;]/);
      const idx = {
        date:   ['date','data','dt','fecha'].map(k => cols.findIndex(c => c.includes(k))).find(i => i >= 0) ?? 0,
        desc:   ['title','descri','memo','hist','name','nome','lancamento'].map(k => cols.findIndex(c => c.includes(k))).find(i => i >= 0) ?? 1,
        amount: ['amount','valor','montante','value','debito','credito'].map(k => cols.findIndex(c => c.includes(k))).find(i => i >= 0) ?? 2,
      };
      lines.slice(1).forEach(line => {
        if (!line.trim()) return;
        const parts = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(p => p.replace(/^"|"$/g, '').trim());
        if (parts.length < 3) return;
        const rawDate = parts[idx.date] || '';
        const desc = parts[idx.desc] || 'Sem descrição';
        const rawAmount = (parts[idx.amount] || '0').replace(/[R$\s]/g,'').replace(',','.');
        const amount = Math.abs(parseFloat(rawAmount));
        if (isNaN(amount) || amount === 0) return;
        // Parse date: dd/mm/yyyy or yyyy-mm-dd
        let date = '';
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(rawDate)) {
          const [d,m,y] = rawDate.split('/');
          date = `${y}-${m}-${d}`;
        } else if (/^\d{4}-\d{2}-\d{2}/.test(rawDate)) {
          date = rawDate.slice(0,10);
        } else { date = new Date().toISOString().slice(0,10); }
        transactions.push({ date, amount, description: desc, type: parseFloat(rawAmount) < 0 ? 'expense' : 'expense' });
      });
      return transactions;
    }

    // --- Import modal logic ---
    let pendingImport = [];

    function openImportModal() {
      document.getElementById('importFileInput').value = '';
      document.getElementById('importFileInput').click();
    }

    function handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const content = ev.target.result;
        const ext = file.name.split('.').pop().toLowerCase();
        let txns = [];
        try {
          if (ext === 'ofx' || ext === 'qfx' || content.includes('<OFX>') || content.includes('<ofx>')) {
            txns = parseOFX(content);
          } else {
            txns = parseCSV(content);
          }
        } catch(err) {
          alert('Não foi possível ler o arquivo: ' + err.message); return;
        }
        if (txns.length === 0) {
          alert('Nenhuma transação encontrada no arquivo. Verifique se é um OFX ou CSV válido.'); return;
        }
        // Auto-categorize
        txns = txns.map(t => ({ ...t, category: autoCategorize(t.description), include: true }));
        pendingImport = txns;
        renderImportPreview(txns);
        document.getElementById('importModal').classList.add('active');
      };
      reader.readAsText(file, 'UTF-8');
    }

    function renderImportPreview(txns) {
      const catOptions = Object.entries(CATEGORIES).map(([k,v]) => `<option value="${k}">${v.emoji} ${v.label}</option>`).join('');
      const total = txns.reduce((s,t) => s + (t.type==='expense' ? -t.amount : t.amount), 0);
      const totalFmt = formatCurrency(Math.abs(total));
      document.getElementById('importSummaryBar').innerHTML = `
        <span class="import-badge">${txns.length} transações</span>
        <span>Total despesas: <strong>${formatCurrency(txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))}</strong></span>
        <span>Total receitas: <strong>${formatCurrency(txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0))}</strong></span>
        <span style="margin-left:auto;font-size:0.74rem;color:var(--text-muted)">✏️ Ajuste categorias antes de importar</span>
      `;
      document.getElementById('importTableBody').innerHTML = txns.map((t, i) => {
        const cat = CATEGORIES[t.category] || CATEGORIES['outros'];
        const amtCls = t.type === 'expense' ? 'import-amount-expense' : 'import-amount-income';
        const amtSign = t.type === 'expense' ? '-' : '+';
        const selOpts = catOptions.replace(`value="${t.category}"`, `value="${t.category}" selected`);
        return `<tr id="import-row-${i}" class="${t.include ? '' : 'row-skip'}">
          <td><input type="checkbox" ${t.include ? 'checked' : ''} onchange="toggleImportRow(${i}, this.checked)"></td>
          <td style="white-space:nowrap;color:var(--text-muted)">${t.date.split('-').reverse().join('/')}</td>
          <td><span class="import-desc" title="${t.description}">${t.description}</span></td>
          <td class="${amtCls}">${amtSign}${formatCurrency(t.amount)}</td>
          <td><select class="import-cat-select" onchange="updateImportCat(${i}, this.value)">${selOpts}</select></td>
        </tr>`;
      }).join('');
      updateImportBtn();
    }

    function toggleImportRow(i, checked) {
      pendingImport[i].include = checked;
      document.getElementById('import-row-'+i).className = checked ? '' : 'row-skip';
      updateImportBtn();
    }

    function toggleAllImport(checked) {
      pendingImport.forEach((t,i) => {
        t.include = checked;
        const row = document.getElementById('import-row-'+i);
        if (row) row.className = checked ? '' : 'row-skip';
      });
      updateImportBtn();
    }

    function updateImportCat(i, cat) { pendingImport[i].category = cat; }

    function updateImportBtn() {
      const n = pendingImport.filter(t => t.include).length;
      document.getElementById('importConfirmBtn').textContent = `✅ Importar ${n} transaç${n !== 1 ? 'ões' : 'ão'}`;
    }

    function confirmImport() {
      const toImport = pendingImport.filter(t => t.include);
      if (toImport.length === 0) { alert('Selecione ao menos uma transação.'); return; }
      const existing = getTransactions();
      const newTxns = toImport.map(t => ({
        id: 'imp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        description: t.description,
        amount: t.amount,
        category: t.category,
        type: t.type,
        date: t.date,
        createdAt: Date.now(),
      }));
      saveTransactions([...newTxns, ...existing]);
      closeImportModal();
      refreshAllDisplays();
      setTimeout(() => alert(`✅ ${newTxns.length} transações importadas com sucesso!`), 100);
    }

    function closeImportModal() {
      document.getElementById('importModal').classList.remove('active');
      pendingImport = [];
    }

    async function init() {
      initNav(); populateFilterCategories(); setType('expense');
      await refreshAllDisplays();
    }
    window.addEventListener('load', init);
  </script>
</body>
</html>
